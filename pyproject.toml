[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "odooupgrader"
version = "0.4.0"
description = "Local Docker/OpenUpgrade CLI with verified checkpoints and diagnostics"
requires-python = ">=3.10"
dependencies = ["click>=8", "packaging>=23", "requests>=2.31", "rich>=13"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
odooupgrader = "odooupgrader.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
